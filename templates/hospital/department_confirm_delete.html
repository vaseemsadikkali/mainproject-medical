{% extends 'base.html' %}

{% block title %}Delete Department - MediCare Hub{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card form-card p-4 text-center">
                <div class="text-danger fs-1 mb-2">
                    <i class="bi bi-trash3-fill"></i>
                </div>
                <h4 class="fw-bold mb-2">Delete Department?</h4>
                <p class="text-muted small mb-4">
                    Are you sure you want to delete the clinical department <strong>{{ dept.name }}</strong>? This action cannot be undone.
                </p>

                <form method="POST" class="d-flex justify-content-center gap-3">
                    {% csrf_token %}
                    <a href="{% url 'departments_list' %}" class="btn btn-outline-secondary px-4">
                        Cancel
                    </a>
                    <button type="submit" class="btn btn-danger px-4">
                        Yes, Delete Department
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
