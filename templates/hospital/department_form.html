{% extends 'base.html' %}

{% block title %}{{ title }} - MediCare Hub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card form-card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold mb-0"><i class="bi bi-folder-plus text-teal me-2"></i> {{ title }}</h4>
                    <a href="{% url 'departments_list' %}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-arrow-left"></i> Back
                    </a>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Department Name *</label>
                        {{ form.name }}
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Bootstrap Icon Class</label>
                        {{ form.icon }}
                        <small class="text-muted">e.g. bi-heart-pulse, bi-lungs, bi-capsule, bi-bandaid, bi-activity</small>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Description</label>
                        {{ form.description }}
                    </div>

                    <div class="form-check mb-4">
                        {{ form.is_active }}
                        <label class="form-check-label fw-semibold" for="{{ form.is_active.id_for_label }}">
                            Active Department
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100">
                        <i class="bi bi-check2 me-1"></i> Save Department
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
