<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#047857" stop-opacity="0.92"/>
      <stop offset="75%" stop-color="#0d9488" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.92"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="80%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Sky Base -->
  <rect width="1440" height="600" fill="url(#skyGrad)"/>
  <rect width="1440" height="600" fill="url(#sunGlow)"/>

  <!-- Distant Western Ghats Mountain Silhouettes -->
  <path d="M0,380 Q 200,290 420,350 T 880,310 T 1200,340 T 1440,300 L 1440,600 L 0,600 Z" fill="#064e3b" opacity="0.35"/>
  <path d="M0,410 Q 280,340 560,390 T 1060,360 T 1440,380 L 1440,600 L 0,600 Z" fill="#022c22" opacity="0.45"/>

  <!-- Serene Kerala Backwaters -->
  <path d="M0,450 Q 360,430 720,460 T 1440,440 L 1440,600 L 0,600 Z" fill="url(#waterGrad)"/>

  <!-- Gentle Water Ripples -->
  <path d="M120,490 Q 240,486 360,490 T 600,490" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.25" fill="none"/>
  <path d="M700,510 Q 820,506 940,510 T 1180,510" stroke="#a7f3d0" stroke-width="1.5" stroke-opacity="0.2" fill="none"/>
  <path d="M300,535 Q 460,530 620,535 T 940,535" stroke="#fde68a" stroke-width="1" stroke-opacity="0.2" fill="none"/>

  <!-- Traditional Kerala Kettuvallam (Houseboat) Silhouette on right -->
  <g transform="translate(1020, 420) scale(0.65)" opacity="0.65">
    <!-- Boat Hull -->
    <path d="M 10,70 C 60,85 240,85 290,70 C 270,95 30,95 10,70 Z" fill="#0f172a"/>
    <!-- Curved Thatched Roof Canopy (Panambu) -->
    <path d="M 40,70 Q 150,15 260,70 Z" fill="#1e293b"/>
    <path d="M 60,68 Q 150,25 240,68" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" fill="none"/>
    <path d="M 80,68 Q 150,35 220,68" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.3" fill="none"/>
    <!-- Bow and Stern prows -->
    <path d="M 10,70 C -5,55 -15,40 -20,25 C -15,35 0,55 10,70 Z" fill="#0f172a"/>
    <path d="M 290,70 C 305,58 318,45 325,30 C 318,42 300,60 290,70 Z" fill="#0f172a"/>
    <!-- Lantern on boat -->
    <circle cx="270" cy="55" r="4" fill="#fde047" opacity="0.85"/>
  </g>

  <!-- Majestic Coconut Palms (Thengu) on Left Shore -->
  <g transform="translate(60, 240)" opacity="0.55">
    <!-- Trunk 1 -->
    <path d="M 80,360 Q 65,220 120,80 Q 125,220 95,360 Z" fill="#022c22"/>
    <!-- Fronds 1 -->
    <path d="M 120,80 Q 40,30 -20,70 Q 50,60 120,80" fill="#064e3b"/>
    <path d="M 120,80 Q 90,0 30,-20 Q 80,20 120,80" fill="#065f46"/>
    <path d="M 120,80 Q 140,-30 150,-60 Q 140,10 120,80" fill="#047857"/>
    <path d="M 120,80 Q 180,0 230,-10 Q 180,35 120,80" fill="#065f46"/>
    <path d="M 120,80 Q 210,40 260,90 Q 190,75 120,80" fill="#064e3b"/>
    <path d="M 120,80 Q 160,110 200,160 Q 150,120 120,80" fill="#022c22"/>

    <!-- Trunk 2 (Leaning more into the water) -->
    <path d="M 130,360 Q 155,240 220,130 Q 210,240 145,360 Z" fill="#022c22"/>
    <!-- Fronds 2 -->
    <path d="M 220,130 Q 150,90 90,120 Q 160,120 220,130" fill="#064e3b"/>
    <path d="M 220,130 Q 190,60 150,40 Q 190,80 220,130" fill="#047857"/>
    <path d="M 220,130 Q 240,40 260,20 Q 245,80 220,130" fill="#059669"/>
    <path d="M 220,130 Q 290,70 340,70 Q 280,100 220,130" fill="#047857"/>
    <path d="M 220,130 Q 290,130 330,170 Q 270,145 220,130" fill="#064e3b"/>
  </g>

  <!-- Second Coconut Palm Cluster on Far Right -->
  <g transform="translate(1320, 270) scale(0.85)" opacity="0.45">
    <path d="M 40,330 Q 20,200 -20,80 Q -10,200 25,330 Z" fill="#022c22"/>
    <path d="M -20,80 Q -90,40 -140,80 Q -80,70 -20,80" fill="#064e3b"/>
    <path d="M -20,80 Q -60,0 -90,-20 Q -50,20 -20,80" fill="#047857"/>
    <path d="M -20,80 Q -10,-40 0,-60 Q -5,10 -20,80" fill="#059669"/>
    <path d="M -20,80 Q 40,0 80,-10 Q 40,35 -20,80" fill="#047857"/>
    <path d="M -20,80 Q 60,50 110,90 Q 50,75 -20,80" fill="#064e3b"/>
  </g>
</svg>
