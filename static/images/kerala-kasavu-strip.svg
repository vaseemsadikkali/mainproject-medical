<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="100%" height="24" preserveAspectRatio="none">
  <defs>
    <linearGradient id="kasavuGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="25%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fef08a"/>
      <stop offset="75%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="kasavuPattern" width="40" height="24" patternUnits="userSpaceOnUse">
      <!-- Thin borders -->
      <line x1="0" y1="2" x2="40" y2="2" stroke="#d97706" stroke-width="1"/>
      <line x1="0" y1="22" x2="40" y2="22" stroke="#d97706" stroke-width="1"/>
      
      <!-- Central Kerala Kasavu Diamonds -->
      <polygon points="20,4 32,12 20,20 8,12" fill="url(#kasavuGold)"/>
      <polygon points="20,7 27,12 20,17 13,12" fill="#78350f"/>
      <circle cx="20" cy="12" r="2.5" fill="#fef08a"/>

      <!-- Connecting Dots -->
      <circle cx="2" cy="12" r="1.5" fill="url(#kasavuGold)"/>
      <circle cx="38" cy="12" r="1.5" fill="url(#kasavuGold)"/>
    </pattern>
  </defs>

  <rect width="1200" height="24" fill="url(#kasavuPattern)"/>
</svg>
